version: '3.8'
services:
  monolith-backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:8011nedimK216@postgres:5432/monolith_db?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  monolith-client:
    build: ./client
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8011nedimK216
      POSTGRES_DB: monolith_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_monolith:/var/lib/postgresql/data

volumes:
  postgres_data_monolith:
