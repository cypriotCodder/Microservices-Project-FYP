version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  # Dashboard + InfluxDB reverse proxy on port 8087.
  # Serves the dashboard HTML and proxies /query to InfluxDB from the SAME
  # origin, eliminating all CORS issues.
  # Open: http://localhost:8087
  influx-cors-proxy:
    image: nginx:alpine
    ports:
      - "8087:80"
    depends_on:
      - influxdb
    volumes:
      - ./nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
      - ./presentation_dashboard.html:/usr/share/nginx/html/presentation_dashboard.html:ro
      - ./diag.html:/usr/share/nginx/html/diag.html:ro
      - ./chart.umd.min.js:/usr/share/nginx/html/chart.umd.min.js:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards/k6.json:/var/lib/grafana/dashboards/k6.json:ro
      - ./grafana/dashboards/architectural_contrast.json:/var/lib/grafana/dashboards/architectural_contrast.json:ro

  k6:
    image: grafana/k6:latest
    profiles:
      - testing
    volumes:
      - ./loadtest.js:/scripts/loadtest.js:ro
      - ./loadtest-demo.js:/scripts/loadtest-demo.js:ro
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - TARGET_URL=${TARGET_URL:-http://host.docker.internal:8080}
      - ARCH=${ARCH:-unknown}
    # --tag arch=... stamps EVERY k6 metric in InfluxDB with the arch label,
    # not just per-request HTTP metrics. This is what makes GROUP BY "arch"
    # work for vus, http_reqs, error-rate panels in Grafana.
    command: run --tag arch=${ARCH:-unknown} /scripts/loadtest.js

