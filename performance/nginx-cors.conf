# nginx-cors.conf — Serves the dashboard AND proxies InfluxDB queries
# from the SAME origin (http://localhost:8087), eliminating CORS entirely.
#
# Dashboard:  http://localhost:8087/                → presentation_dashboard.html
# InfluxDB:   http://localhost:8087/query?db=k6&... → proxied to influxdb:8086

server {
    listen 80;
    server_name _;

    # ── Serve the dashboard HTML ──
    root /usr/share/nginx/html;
    index presentation_dashboard.html;

    # ── Proxy InfluxDB API ──
    location /query {
        proxy_pass         http://influxdb:8086/query;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Also proxy /write and /ping in case needed
    location /write {
        proxy_pass         http://influxdb:8086/write;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /ping {
        proxy_pass         http://influxdb:8086/ping;
        proxy_set_header   Host $host;
    }

    # ── Serve static files (the dashboard) ──
    location / {
        try_files $uri $uri/ /presentation_dashboard.html;
    }
}
