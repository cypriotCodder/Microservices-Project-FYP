services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    env_file: ./api-gateway/.env
    environment:
      - SERVICE_NAME=api-gateway
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3004
      - LLM_SERVICE_URL=http://llm-service:3005
      - CONTENT_CREATOR_URL=http://content-creator:3008
    depends_on:
      - auth-service
      - product-service
      - order-service
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
    volumes:
      - mongodb_data:/data/db
    # Cap WiredTiger cache so the Linux OOM killer doesn't terminate MongoDB
    # under 300-VU load. Default is 50% of RAM which can exhaust all memory.
    command: mongod --wiredTigerCacheSizeGB 0.5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Cap memory so Redis evicts LRU keys instead of OOM-crashing under load.
    # 'save ""' disables RDB snapshots — avoids loading a massive persisted
    # comment dump at startup that consumes memory before any VU connects.
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8011nedimK216
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    env_file: ./services/auth-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:8011nedimK216@postgres:5432/microservices_db?schema=public

  product-service:
    build: ./services/product-service
    ports:
      - "3002:3002"
    env_file: ./services/product-service/.env
    environment:
      - SERVICE_NAME=product-service
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://root:examplepassword@mongo:27017/microservices_products?authSource=admin
    restart: on-failure

  order-service:
    build: ./services/order-service
    ports:
      - "3003:3003"
    env_file: ./services/order-service/.env
    environment:
      - SERVICE_NAME=order-service
      - MONGO_URI=mongodb://root:examplepassword@mongo:27017/microservices_orders?authSource=admin
    restart: on-failure

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "3004:3004"
    env_file: ./services/recommendation-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:8011nedimK216@postgres:5432/microservices_db?schema=recommendation

  traffic-service:
    build: ./services/traffic-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
    depends_on:
      - api-gateway

  llm-service:
    build: ./services/llm-service
    ports:
      - "3005:3005"
    env_file: ./services/llm-service/.env
    environment:
      - PORT=3005

  content-creator:
    build: ./services/content-creator
    ports:
      - "3008:3008"
    environment:
      - PORT=3008

  client:
    build: ./client
    ports:
      - "5178:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./client:/app
      - /app/node_modules

  telegraf:
    image: telegraf:latest
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4318:4318" # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
